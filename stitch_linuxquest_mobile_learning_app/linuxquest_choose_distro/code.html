or": "#690005", "surface-container-lowest": "#0a0e14", "outline": "#859397", "error": "#F85149", "inverse-surface": "#dfe2eb", "on-secondary-fixed-variant": "#7b0190", "primary-container": "#22d3ee", "light-border": "#D0D7DE", "track-dev": "#A78BFA", "warning": "#D29922", "tertiary": "#ffd6a3", "on-background": "#dfe2eb", "on-primary-fixed-variant": "#004e5a", "secondary-container": "#7d0793", "outline-variant": "#3c494c", "light-background": "#FFFFFF", "light-surface": "#F6F8FA" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-md": "0.75rem", "space-lg": "1rem", "margin": "1rem", "space-xs": "0.25rem", "gutter": "1rem", "space-xl": "1.5rem" }, fontFamily: { "code-bold": ["JetBrains Mono"], "code-terminal": ["JetBrains Mono"], "code-caption": ["JetBrains Mono"], "label-meta": ["Inter"], "headline-section": ["Inter"], "title-card": ["Inter"], "body-medium": ["Inter"], "display-title": ["Inter"], "body-default": ["Inter"] }, fontSize: { "code-bold": ["14px", { lineHeight: "20px", fontWeight: "600" }], "code-terminal": ["14px", { lineHeight: "20px", fontWeight: "400" }], "code-caption": ["12px", { lineHeight: "16px", fontWeight: "500" }], "label-meta": ["12px", { lineHeight: "16px", fontWeight: "500" }], "headline-section": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "title-card": ["16px", { lineHeight: "24px", fontWeight: "600" }], "body-medium": ["14px", { lineHeight: "20px", fontWeight: "500" }], "display-title": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "700" }], "body-default": ["14px", { lineHeight: "20px", fontWeight: "400" }] } } } }</script></head><body class="bg-background text-on-surface font-body-default text-body-default min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe px-gutter bg-background"><div class="flex <img alt="LinuxQuest Terminal Logo" class="w-8 h-8 rounded object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WphEFNCwiWX5OzFQce9D8MlceItEb2N1AID8jwQDbgUOrf6P42VcZzo22RHqb89hDUiRbX6Rg62nt4hHJf9Iz0EPPTF05qNt9PM0uKS6Xt7ljcT155NLbmOAvj1lPBkKvFokMVwV8oLS1KCe4KsQQE4jQidpTGM7cc1Nyh_uvK0KsmYtKvb9vWqXFHsGExAC2i2EQes6kpBpnzreHgAN8KK3j-HG0H9RDjDqbs2mU-VCsXcN-vjuFbnUs"/>
</div>

<span class="font-headline-section text-headline-section text-text-primary tracking-tight">LinuxQuest</span>
<span class="font-code-caption text-code-caption px-1.5 py-0.5 rounded bg-surface-container-high text-primary font-semibold uppercase tracking-wider">PWA</span>

<h1 class="font-display-title text-display-title text-text-primary mb-1">Choose your Linux</h1>
<p class="font-body-default text-body-default text-text-secondary">You can switch anytime.</p>
</div>
<!-- Distro Cards Grid (2x2) -->
<div aria-label="Linux Distribution Selection" class="grid grid-cols-2 gap-3 mb-8 w-full" id="distro-grid" role="radiogroup">
<!-- 1. Ubuntu (Initial Selected State) -->
<div aria-checked="true" class="distro-card group relative p-4 rounded-xl cursor-pointer transition-all duration-200 select-none flex flex-col items-start bg-surface shadow-[0_0_16px_rgba(34,211,238,0.18)]" id="card-ubuntu" onclick="selectDistro('ubuntu')" role="radio" tabindex="0">
<!-- Dynamic Selection Ring (Inner layer avoiding direct border utilities) -->
<div class="selection-indicator absolute inset-0 rounded-xl bg-primary/10 pointer-events-none transition-opacity"></div>
<div class="selection-pill absolute -inset-[1.5px] rounded-[13px] bg-primary/40 -z-10 pointer-events-none"></div>
<!-- Status Checkmark Badge -->
<div class="badge-check absolute top-3 right-3 w-5 h-5 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-surface-container-lowest text-[14px] font-bold">check</span>
</div>
<!-- Distro Icon: Ubuntu -->
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center mb-3">
<svg class="w-7 h-7" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" fill="#E95420" r="10"></circle>
<circle cx="18" cy="12" fill="#FFFFFF" r="1.7"></circle>
<circle cx="9" cy="6.8" fill="#FFFFFF" r="1.7"></circle>
<circle cx="9" cy="17.2" fill="#FFFFFF" r="1.7"></circle>
<path d="M14.5 12a3.5 3.5 0 0 1-2.2 3.25m-1.3.15A3.5 3.5 0 0 1 8.5 12a3.5 3.5 0 0 1 2.5-3.4" stroke="#FFFFFF" stroke-linecap="round" stroke-width="1.4"></path>
</svg>
</div>
<span class="font-title-card text-title-card text-text-primary tracking-tight">Ubuntu</span>
<span class="font-label-meta text-label-meta text-text-secondary mt-0.5 line-clamp-1">Beginner-friendly</span>
</div>
<!-- 2. Arch -->
<div aria-checked="false" class="distro-card group relative p-4 rounded-xl cursor-pointer transition-all duration-200 select-none flex flex-col items-start bg-surface hover:bg-surface-container" id="card-arch" onclick="selectDistro('arch')" role="radio" tabindex="0">
<div class="selection-indicator hidden absolute inset-0 rounded-xl bg-primary/10 pointer-events-none"></div>
<div class="selection-pill hidden absolute -inset-[1.5px] rounded-[13px] bg-primary/40 -z-10 pointer-events-none"></div>
<div class="badge-check hidden absolute top-3 right-3 w-5 h-5 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-surface-container-lowest text-[14px] font-bold">check</span>
</div>
<!-- Distro Icon: Arch -->
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center mb-3">
<svg class="w-7 h-7" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3L5.5 18.5L8.5 18L10 14.5C10.5 15.5 11.2 16.2 12 17C12.8 16.2 13.5 15.5 14 14.5L15.5 18L18.5 18.5L12 3Z" fill="#1793D1"></path>
<path d="M12 8L13.8 13.5C13.2 13.9 12.6 14.1 12 14.1C11.4 14.1 10.8 13.9 10.2 13.5L12 8Z" fill="#FFFFFF"></path>
</svg>
</div>
<span class="font-title-card text-title-card text-text-primary tracking-tight">Arch</span>
<span class="font-label-meta text-label-meta text-text-secondary mt-0.5 line-clamp-1">For tinkerers</span>
</div>
<!-- 3. Fedora -->
<div aria-checked="false" class="distro-card group relative p-4 rounded-xl cursor-pointer transition-all duration-200 select-none flex flex-col items-start bg-surface hover:bg-surface-container" id="card-fedora" onclick="selectDistro('fedora')" role="radio" tabindex="0">
<div class="selection-indicator hidden absolute inset-0 rounded-xl bg-primary/10 pointer-events-none"></div>
<div class="selection-pill hidden absolute -inset-[1.5px] rounded-[13px] bg-primary/40 -z-10 pointer-events-none"></div>
<div class="badge-check hidden absolute top-3 right-3 w-5 h-5 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-surface-container-lowest text-[14px] font-bold">check</span>
</div>
<!-- Distro Icon: Fedora -->
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center mb-3">
<svg class="w-7 h-7" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" fill="#294172" r="10"></circle>
<path d="M13 6.5C10.5 6.5 8.5 8.5 8.5 11v6.5h3.5v-4h2.5c2 0 3-1.5 3-3.5 0-2.2-1.8-3.5-4.5-3.5z" fill="#3C6EB4"></path>
<path d="M12 9.5c-1.1 0-2 .9-2 2v2.5h2v-2.5c0-.6.4-1 1-1s1 .4 1 1v.5h2v-.5c0-1.7-1.3-3-3-3z" fill="#FFFFFF"></path>
<rect fill="#FFFFFF" height="1.8" rx="0.9" width="5" x="7" y="11"></rect>
</svg>
</div>
<span class="font-title-card text-title-card text-text-primary tracking-tight">Fedora</span>
<span class="font-label-meta text-label-meta text-text-secondary mt-0.5 line-clamp-1">Enterprise-ready</span>
</div>
<!-- 4. Alpine -->
<div aria-checked="false" class="distro-card group relative p-4 rounded-xl cursor-pointer transition-all duration-200 select-none flex flex-col items-start bg-surface hover:bg-surface-container" id="card-alpine" onclick="selectDistro('alpine')" role="radio" tabindex="0">
<div class="selection-indicator hidden absolute inset-0 rounded-xl bg-primary/10 pointer-events-none"></div>
<div class="selection-pill hidden absolute -inset-[1.5px] rounded-[13px] bg-primary/40 -z-10 pointer-events-none"></div>
<div class="badge-check hidden absolute top-3 right-3 w-5 h-5 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-surface-container-lowest text-[14px] font-bold">check</span>
</div>
<!-- Distro Icon: Alpine -->
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center mb-3">
<svg class="w-7 h-7" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 17.5L9.5 8L13 14L15.5 10L20 17.5H4Z" fill="#0D597F"></path>

</svg>

<span class="font-title-card text-title-card text-text-primary tracking-tight">Alpine</span>
<span class="font-label-meta text-label-meta text-text-secondary mt-0.5 line-clamp-1">Minimal &amp; fast</span>
</div>

<!-- Active Terminal Prompt Teaser (Delight element) -->
<div class="w-full bg-terminal-dark-box rounded-lg p-3 mb-6 shadow-inner">
<div class="flex items-center gap-2 mb-1.5">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="w-2 h-2 rounded-full bg-warning"></span>
<span class="w-2 h-2 rounded-full bg-success"></span>
<span class="font-code-caption text-code-caption text-text-secondary ml-1">sandbox:init</span>
</div>
<div class="font-code-terminal text-code-terminal text-text-primary flex items-center gap-1.5">
<span class="text-primary font-bold">$</span>
<span class="text-text-secondary">env --distro=</span><span class="text-primary font-semibold" id="terminal-distro-arg">ubuntu</span>
<span class="inline-block w-1.5 h-3.5 bg-primary animate-pulse ml-0.5"></span>
</div>
</div>
<!-- Bottom Sticky-like Action Area -->
<div class="flex flex-col items-center w-full gap-2">
<button class="w-full h-12 rounded bg-primary text-surface-container-lowest font-body-medium text-body-medium font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0_0_12px_rgba(34,211,238,0.25)] hover:bg-primary-fixed" id="cta-start" onclick="handleStart()" type="button">
<span>Start Learning</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="h-11 px-4 flex items-center justify-center font-body-default text-body-default text-text-secondary hover:text-text-primary active:opacity-75 transition-colors" onclick="handleSkip()" type="button">
        Skip for now
      </button>
</div>
</div>
</div>
<script>
  const distros = ['ubuntu', 'arch', 'fedora', 'alpine'];

  function selectDistro(selected) {
    distros.forEach(id => {
      const card = document.getElementById('card-' + id);
      if (!card) return;
      
      const indicator = card.querySelector('.selection-indicator');
      const pill = card.querySelector('.selection-pill');
      const badge = card.querySelector('.badge-check');

      if (id === selected) {
        card.setAttribute('aria-checked', 'true');
        card.classList.add('shadow-[0_0_16px_rgba(34,211,238,0.18)]');
        if (indicator) indicator.classList.remove('hidden');
        if (pill) pill.classList.remove('hidden');
        if (badge) badge.classList.remove('hidden');
      } else {
        card.setAttribute('aria-checked', 'false');
        card.classList.remove('shadow-[0_0_16px_rgba(34,211,238,0.18)]');
        if (indicator) indicator.classList.add('hidden');
        if (pill) pill.classList.add('hidden');
        if (badge) badge.classList.add('hidden');
      }
    });

    const terminalArg = document.getElementById('terminal-distro-arg');
    if (terminalArg) {
      terminalArg.textContent = selected;
    }
  }

  function handleStart() {
    const activeDistro = document.querySelector('[role="radio"][aria-checked="true"]');
    const name = activeDistro ? activeDistro.id.replace('card-', '') : 'ubuntu';
    const btn = document.getElementById('cta-start');
    if (btn) {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span><span>Booting ' + name + '...</span>';
      setTimeout(() => {
        btn.innerHTML = '<span>Ready!</span><span class="material-symbols-outlined text-[18px]">check</span>';
      }, 700);
    }
  }

  function handleSkip() {
    selectDistro('ubuntu');
    handleStart();
  }

  // Support basic keyboard arrow navigation
  document.getElementById('distro-grid')?.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    if (!active || !active.classList.contains('distro-card')) return;
    
    const currentIndex = distros.indexOf(active.id.replace('card-', ''));
    if (currentIndex === -1) return;

    let nextIndex = currentIndex;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      nextIndex = (currentIndex + 1) % distros.length;
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      nextIndex = (currentIndex - 1 + distros.length) % distros.length;
    } else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      selectDistro(distros[currentIndex]);
      return;
    }

    if (nextIndex !== currentIndex) {
      e.preventDefault();
      const nextCard = document.getElementById('card-' + distros[nextIndex]);
      nextCard?.focus();
      selectDistro(distros[nextIndex]);
    }
  });
</script></main></body></html>
